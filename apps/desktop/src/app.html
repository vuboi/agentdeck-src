<!doctype html>
<html lang="en" z-theme="neutral">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0a0a0a" />
        <script src="/theme-boot.js"></script>
        %sveltekit.head%
    </head>
    <body
        data-sveltekit-preload-data="hover"
        class="bg-background text-foreground"
    >
        <!-- Shown from the first paint until the app has read the open chat (+layout.svelte removes it): before the
             JavaScript loads the window would otherwise stay blank. -->
        <div
            id="boot-splash"
            style="
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                background: var(--background);
                z-index: 9999;
            "
        >
                                    <div class="boot-comet"><b><i style="--z-index: 0"></i><i style="--z-index: 1"></i><i style="--z-index: 2"></i><i style="--z-index: 3"></i><i style="--z-index: 4"></i><i style="--z-index: 5"></i></b></div>
        </div>
        <style>
            .boot-comet { position: relative; width: 28px; height: 28px; color: var(--primary); }
            .boot-comet b { position: absolute; inset: 0; animation: boot-spin 1s linear infinite; }
            .boot-comet i {
                --z-dot: calc(28px * 0.2 * (1 - var(--z-index) * 0.13));
                position: absolute; top: 50%; left: 50%;
                width: var(--z-dot); height: var(--z-dot);
                margin: calc(var(--z-dot) / -2) 0 0 calc(var(--z-dot) / -2);
                border-radius: 999px; background: currentColor;
                opacity: calc(1 - var(--z-index) * 0.16);
                transform: rotate(calc(var(--z-index) * -15deg)) translateY(-11.2px);
            }
            @keyframes boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
